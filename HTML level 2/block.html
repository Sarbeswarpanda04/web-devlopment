<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Elements</title>
</head>
<body>
    <h1>This is a heading</h1> <!-- Block element -->
    <p>This is a paragraph</p> <!-- Block element -->
    <div>This is a div element</div> <!-- Block element -->
    <ul>
        <li>This is a list item</li> <!-- Block element -->
        <li>This is another list item</li> <!-- Block element -->
    </ul>
</body>
</html>
