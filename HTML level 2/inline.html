<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Elements</title>
</head>
<body>
    <span>This is a span element</span> <!-- Inline element -->
    <a href="https://example.com">This is an anchor element</a> <!-- Inline element -->
    <strong>This is a strong element</strong> <!-- Inline element -->
    <em>This is an emphasized element</em> <!-- Inline element -->
    <i>This is an italic element</i> <!-- Inline element -->
    <img width="32" height="32" src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Google_Favicon_2025.svg" alt="Description of the image"> <!-- Inline element -->
    <button>Click me</button> <!-- Inline element -->
</body>
</html>
