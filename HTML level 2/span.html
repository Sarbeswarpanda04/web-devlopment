<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span Elements</title>
</head>
<body>
    <span>This is a span element</span> <!-- Inline element -->
    <span style="color: red;">This is a red span element</span> <!-- Inline element with style -->
    <span style="font-weight: bold;">This is a bold span element</span> <!-- Inline element with style -->
    <span style="font-style: italic;">This is an italic span element</span> <!-- Inline element with style -->
    <span style="text-decoration: underline;">This is an underlined span element</span> <!-- Inline element with style -->

</body>
</html>
