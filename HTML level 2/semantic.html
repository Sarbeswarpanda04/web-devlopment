<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic tag</title>
</head>
<body>
    <heading>Heading is a semantic tag</heading>
    <main>main is a semantic tag</main>
    <nav>nav is a semantic tag</nav>
    <footer>footer is a semantic tag</footer>
    <section>section is a semantic tag</section>
    <aside>aside is a semantic tag</aside>
    <button>button is a semantic tag</button>
    <hr>

    <!--  GOOD: Semantic Approach -->
    <p>Below is a GOOD Semantic Approach</p>
    <hr>
    <header>
        <h1>My Blog</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main>
        <article>
            <h2>Introduction to HTML</h2>
            <p>Semantic tags make your code cleaner...</p>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 My Blog</p>
    </footer>

</body>

</html>
