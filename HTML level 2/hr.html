<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hr - Horizontal Rule</title>
</head>
<body>
    <h1>Horizontal Rule</h1>
    <hr>
    <p>The <code>&lt;hr&gt;</code> tag is used to create a horizontal line in HTML. It is a self-closing tag and does not require a closing tag.</p>
    <p>Example:</p>

    <hr> <!-- Horizontal line -->
    <p>This is some text under the horizontal line.</p>

</body>
</html>
