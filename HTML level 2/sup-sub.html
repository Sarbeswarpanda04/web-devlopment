<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superscript and Subscript</title>
</head>
<body>
    <p>This is a paragraph with <sup>superscript</sup> and <sub>subscript</sub>.</p>

    <h1>H<sub>2</sub>O</h1>
    <h1>C<sup>6</sup>H<sub>12</sub>O<sub>6</sub></h1>
    <h1>Area = πr<sup>2</sup></h1>
    <h1>(a+b)<sup>2</sup>=a<sup>2</sup>+2ab+b<sup>2</sup></h1>
</body>
</html>
